name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange files (works even if uploaded flat)
        run: |
          mkdir -p lib native
          if [ ! -f lib/main.dart ]; then
            f=$(find . -name main.dart -not -path './android/*' -not -path './.dart_tool/*' | head -1)
            [ -n "$f" ] || { echo "ERROR: main.dart not found in repo"; exit 1; }
            mv "$f" lib/main.dart
          fi
          if [ ! -f native/MainActivity.kt ]; then
            f=$(find . -name MainActivity.kt -not -path './android/*' | head -1)
            [ -n "$f" ] || { echo "ERROR: MainActivity.kt not found in repo"; exit 1; }
            mv "$f" native/MainActivity.kt
          fi
          [ -f pubspec.yaml ] || { echo "ERROR: pubspec.yaml must be at the top level of the repo"; exit 1; }
          cp lib/main.dart "$RUNNER_TEMP/main.dart.bak"
          echo "Layout OK:"; ls -R lib native
      - run: flutter create --platforms=android --project-name survey_app --org com.example .
      - name: Patch Android (permissions, label, native SIM channel)
        run: |
          cp "$RUNNER_TEMP/main.dart.bak" lib/main.dart
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms=''.join('<uses-permission android:name="android.permission.%s"/>'%x for x in ['INTERNET','ACCESS_NETWORK_STATE','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','CAMERA','READ_PHONE_STATE'])
          s=re.sub(r'(<manifest[^>]*>)',lambda m:m.group(1)+perms,s,1)
          s=re.sub(r'android:label="[^"]*"','android:label="Transformer Survey"',s,1)
          open(p,'w').write(s)
          PY
          find android/app/src/main -name 'MainActivity.*' -delete
          mkdir -p android/app/src/main/kotlin/com/example/survey_app
          cp native/MainActivity.kt android/app/src/main/kotlin/com/example/survey_app/MainActivity.kt
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: survey-apk
          path: build/app/outputs/flutter-apk/app-release.apk
